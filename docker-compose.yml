services:
  wazuh.manager:
    build: ./docker/wazuh-manager
    container_name: wazuh-manager
    restart: always
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
    volumes:
      - ./config/wazuh/ossec.conf:/var/ossec/etc/ossec.conf
      - ./config/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml
      - ./rules/decoders/custom_decoders.xml:/var/ossec/etc/decoders/custom_decoders.xml
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs

  wazuh.indexer:
    build: ./docker/wazuh-indexer
    container_name: wazuh-indexer
    restart: always
    ports:
      - "9200:9200"

  wazuh.dashboard:
    build: ./docker/wazuh-dashboard
    container_name: wazuh-dashboard
    restart: always
    ports:
      - "5601:5601"
    depends_on:
      - wazuh.indexer

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs: